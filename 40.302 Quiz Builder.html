<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>40.302 Quiz Builder</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f5f6f9; --surface:#ffffff; --text:#1b2130; --muted:#66708a; --border:#dfe3ec;
  --accent:#3857d6; --accent-soft:#e9eeff; --track:#e6e9f1;
  --good:#17935a; --good-soft:#e3f5ec; --bad:#d23b5e; --bad-soft:#fde9ee; --warn:#e08a10;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12151c; --surface:#1b1f2a; --text:#e8ebf3; --muted:#9aa3ba; --border:#2c3244;
    --accent:#7d98ff; --accent-soft:#232c4d; --track:#2a3043;
    --good:#4cc38a; --good-soft:#16302a; --bad:#ff7a98; --bad-soft:#3a1d27; --warn:#f2a73c;
  }
}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1b1f2a; --text:#e8ebf3; --muted:#9aa3ba; --border:#2c3244;
  --accent:#7d98ff; --accent-soft:#232c4d; --track:#2a3043;
  --good:#4cc38a; --good-soft:#16302a; --bad:#ff7a98; --bad-soft:#3a1d27; --warn:#f2a73c;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#app{max-width:780px;margin:0 auto;padding:22px 16px 56px}
h1{font-size:1.55rem;line-height:1.25;margin:0 0 4px}
.sub{color:var(--muted);margin:0}
.sec{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:30px 0 10px}

/* week cards */
.weeks{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.wk{display:block;position:relative;background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:16px;cursor:pointer;transition:border-color .15s,background .15s}
.wk:hover{border-color:var(--accent)}
.wk.on{border-color:var(--accent);background:var(--accent-soft)}
.wk:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.wk input{position:absolute;opacity:0;pointer-events:none}
.wk-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.wk-name{font-weight:700;font-size:1.05rem}
.wk-topic{color:var(--muted);font-size:.88rem}
.check{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--border);display:grid;place-items:center;font-size:14px;color:#fff;background:var(--surface)}
.wk.on .check{background:var(--accent);border-color:var(--accent)}
.acc{margin-top:14px}
.pct{font-size:1.9rem;font-weight:800;line-height:1.1;margin-bottom:6px}
.bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .4s}
.acc-sub{margin-top:7px;font-weight:600}
.acc-note{color:var(--muted);font-size:.82rem}

/* controls */
.seg{display:inline-flex;background:var(--track);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:9px 18px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg input:checked + span{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg input:focus-visible + span{outline:3px solid var(--accent)}
.hint{color:var(--muted);font-size:.88rem;margin:8px 2px 0}
.btn{appearance:none;border:0;border-radius:12px;padding:13px 22px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--border)}
.btn.small{padding:8px 14px;font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.startbar{margin-top:30px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:.88rem;padding:6px 0}
.linkbtn.warn{color:var(--bad)}

/* quiz */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top .grow{flex:1}
.prog{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.count{font-weight:700;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px 20px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.tag.plain{background:var(--track);color:var(--muted)}
.q p{margin:.55em 0}
.fig{background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px;margin:14px 0;text-align:center}
.fig img{max-width:100%;height:auto;display:block;margin:0 auto}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{appearance:none;display:flex;gap:12px;align-items:center;text-align:left;width:100%;font:inherit;color:var(--text);background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:12px 14px;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt:disabled{cursor:default}
.letter{flex:none;width:28px;height:28px;border-radius:8px;background:var(--track);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--muted)}
.otext{flex:1;min-width:0;overflow-x:auto}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .letter{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .letter{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:18px;border-radius:14px;padding:16px 18px;border:2px solid}
.fb.good{background:var(--good-soft);border-color:var(--good)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fbhead{font-weight:800;margin-bottom:6px}
.fb.good .fbhead{color:var(--good)}
.fb.bad .fbhead{color:var(--bad)}
.exp p{margin:.5em 0}
.next{margin-top:16px;display:flex;justify-content:flex-end}
math{font-size:1.12em}
.dm{display:block;overflow-x:auto;overflow-y:hidden;margin:.7em 0;text-align:center}
.otext .dm{text-align:left;margin:.3em 0}
.warnbar{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:.88rem}

/* results */
.big{font-size:3rem;font-weight:800;line-height:1}
.rw{display:grid;gap:12px;margin-top:6px}
.rw .item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.rw .item .line{display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px}
@media (max-width:480px){#app{padding-left:12px;padding-right:12px}.card{padding:18px 14px}}
</style>
</head>
<body>
<div id="app"></div>

/* ---------- WEEK 1 ---------- */
mk(1,1,10,
 [r`Suppose we want to solve`, r`\[ \min_{x\in\mathcal{X}} f(x). \]`, r`Which maximization problem has the same optimal solutions?`],
 [r`\(\max_{x\in\mathcal{X}}\; -f(x)\)`, r`\(\max_{x\in\mathcal{X}}\; |f(x)|\)`, r`\(\max_{x\in\mathcal{X}}\; f(x)\)`, r`\(\max_{x\in\mathcal{X}}\; \dfrac{1}{f(x)}\)`], 0,
 [r`**Key fact:** \(f(x)\le f(y)\iff -f(x)\ge -f(y)\). So the point that minimises \(f\) is exactly the point that maximises \(-f\). The optimal value changes sign, but the optimal solutions are identical.`,
  r`**Why the others fail:** \(\max f\) picks the opposite end. \(|f|\) changes the problem whenever \(f\) takes negative values (e.g. \(f(x)=x\) on \([-1,1]\) is minimised only at \(-1\), but \(|f|\) is maximised at both \(\pm1\)). \(1/f\) is undefined at \(f=0\) and reverses the ordering only when \(f>0\).`]);

mk(1,2,10,
 [r`Consider a neural network that uses ReLU activations and a smooth loss function \(\ell\). Is the training objective necessarily differentiable everywhere with respect to the network weights?`],
 ['No','Yes'], 0,
 [r`**ReLU is not differentiable at 0.** \(\mathrm{ReLU}(z)=\max\{0,z\}\) has a kink at \(z=0\). Composing it with a smooth loss does not remove the kink, so at weights where some pre-activation is exactly 0 the objective can be non-differentiable.`,
  r`In practice this happens on a measure-zero set, and training uses a (sub)gradient there. That is why the answer is "not necessarily", not "never".`]);

mk(1,3,10,
 [r`In the trajectory optimization problem, suppose that \(z_0\) and the controls \(u_0,\dots,u_{T-1}\) are fixed and that`, r`\[ z_{t+1}=F(z_t,u_t). \]`, r`Can the states \(z_1,\dots,z_T\) still be chosen independently?`],
 ['No','Yes'], 0,
 [r`**The dynamics determine the states.** With \(z_0\) and all controls fixed: \(z_1=F(z_0,u_0)\), then \(z_2=F(z_1,u_1)\), and so on. Every \(z_t\) is forced, so none of them can be chosen freely.`,
  r`This is why trajectory optimization either keeps \(z_t\) as variables with the equality constraints \(z_{t+1}=F(z_t,u_t)\), or eliminates them and optimises over the controls only.`]);

mk(1,4,10,
 [r`Suppose that asset \(i\) has a higher expected relative return than asset \(j\), so that \(\bar p_i>\bar p_j\). Short selling is allowed, and we solve`, r`\[ \max_{\mathbf 1^\top x=B}\ \bar p^\top x. \]`, r`For \(t>0\), consider the portfolio with \(x_i=B+t\), \(x_j=-t\), and all other positions equal to zero. What happens to its expected dollar gain as \(t\to\infty\)?`],
 [r`It converges to zero.`, r`It converges to \(B\bar p_i\).`, r`It tends to negative infinity.`, r`It tends to infinity, so the optimization problem is unbounded.`], 3,
 [r`**Feasibility check:** \((B+t)+(-t)=B\), so the budget constraint \(\mathbf 1^\top x=B\) holds for every \(t\).`,
  r`**Gain:** \(\bar p^\top x=\bar p_i(B+t)-\bar p_j t=B\bar p_i+t(\bar p_i-\bar p_j)\). Since \(\bar p_i-\bar p_j>0\), this grows linearly in \(t\) and tends to \(+\infty\).`,
  r`So with unrestricted short selling the linear problem is unbounded: short the worse asset to buy ever more of the better one. This is why the Markowitz model needs a risk term or a no-short-selling constraint.`]);

mk(1,5,10,
 [r`Suppose that short selling is prohibited and, instead of solving the Markowitz problem, we solve`, r`\[ \max_{x\ge 0,\ \mathbf 1^\top x=B}\ \bar p^\top x. \]`, r`If asset \(i^*\) has the largest expected relative return, an optimal solution invests the entire budget in that asset:`, r`\[ x_{i^*}=B,\qquad x_j=0\ \text{ for } j\ne i^*. \]`, r`Which important risk-related issue does this formulation ignore?`],
 [r`The expected return of the portfolio cannot be calculated.`, r`The asset with the largest expected return may also have very high variance.`, r`The portfolio may invest in assets with negative expected returns.`, r`The portfolio may exceed the available budget.`], 1,
 [r`**The model only looks at the mean.** The objective \(\bar p^\top x\) contains no information about variance or correlations, so it puts everything in the single highest-mean asset, which may also be the riskiest. No diversification happens.`,
  r`Markowitz fixes this by adding a variance term, e.g. \(\min\ x^\top\Sigma x\) subject to a target return, which trades expected return against risk.`,
  r`The other options are false: the expected return \(\bar p^\top x\) is easy to compute, and \(\mathbf 1^\top x=B\) enforces the budget.`]);

mk(1,6,10,
 [r`Consider the following alternative formulation of logistic regression:`, r`\[ \min_w\ \frac{1}{m}\left(\sum_{i:\,y_i=1}\bigl(1-h_w(x_i)\bigr)^2+\sum_{i:\,y_i=0}h_w(x_i)^2\right). \]`, r`Does this loss penalize predictions in the desired way, assigning a smaller loss when \(h_w(x_i)\) is closer to the correct label \(y_i\)?`],
 ['Yes','No'], 0,
 [r`**Check each case.** If \(y_i=1\), the loss is \((1-h)^2\): it is 0 at \(h=1\) and grows as \(h\) moves toward 0. If \(y_i=0\), the loss is \(h^2\): it is 0 at \(h=0\) and grows as \(h\) moves toward 1.`,
  r`In both cases the loss is smaller when the prediction is closer to the true label, which is the desired behaviour. (It is a squared-error loss on the probability, simply a different choice from the usual log-loss.)`]);

mk(1,7,10,
 [r`Consider the two regression formulations`, r`\[ \min_w \sum_{i=1}^{m}\bigl(h_w(x_i)-y_i\bigr)^2 \]`, r`and`, r`\[ \min_w \sum_{i=1}^{m}\bigl|h_w(x_i)-y_i\bigr|. \]`, r`If the data contain a few large outliers, which formulation would typically be more strongly affected by them?`],
 ['They are always affected equally','Least-squares regression','Least-absolute-error regression'], 1,
 [r`**Squaring amplifies large errors.** An outlier with residual 10 contributes \(100\) to the least-squares objective but only \(10\) to the absolute-error objective. The squared loss therefore pulls the fit strongly toward outliers.`,
  r`Least-absolute-error (\(\ell_1\)) regression grows only linearly in the residual, so it is more robust to outliers.`]);

mk(1,8,10,
 [r`Consider the regression problem`, r`\[ \min_w\ \max_{i=1,\dots,m}\ \bigl|h_w(x_i)-y_i\bigr|. \]`, r`Which prediction error determines the objective value for a given choice of \(w\)?`],
 ['The sum of the errors','The average error','The largest absolute error'], 2,
 [r`**Read it from the inside out.** For a fixed \(w\), \(\max_i|h_w(x_i)-y_i|\) is the worst-case absolute residual across all data points, so the objective is the largest absolute error.`,
  r`Minimising it over \(w\) is "minimax" (Chebyshev) regression. It is a convex problem and can be written as an LP using an epigraph variable \(s\ge |h_w(x_i)-y_i|\).`]);

mk(1,9,10,
 [r`In least squares regression`, r`\[ \min_{w\in\mathbb{R}^n}\ \frac{1}{2m}\sum_{i=1}^{m}\bigl(h_w(x_i)-y_i\bigr)^2 \]`, r`would the set of optimal solutions change if we remove the factor \(\tfrac1m\)?`],
 ['No','Yes'], 0,
 [r`**Positive scaling does not move the minimiser.** Replacing an objective \(g(w)\) by \(c\,g(w)\) with \(c>0\) keeps \(g(w)\le g(w')\iff c\,g(w)\le c\,g(w')\), so the argmin is unchanged. Only the optimal value is scaled.`,
  r`The \(\tfrac1m\) is just a convenience that makes the objective an average (so it does not grow with the dataset size).`]);

mk(1,10,10,
 [r`An engineer wants to choose the shape of an aircraft wing to minimize drag. For each proposed design, the drag can be evaluated only by running a computational fluid-dynamics simulation. The engineer has no explicit formula or derivative information for the objective.`, r`Based on the information available to the optimizer, how should this problem be classified?`],
 ['A multi-objective optimization problem','An explicit convex optimization problem','A black-box optimization problem','A linear optimization problem'], 2,
 [r`**Classify by what the optimiser can see.** The objective can only be evaluated by running a simulation: there is no formula and no gradient. That is the definition of a black-box (derivative-free) problem.`,
  r`It is not multi-objective (there is a single objective, drag), and nothing indicates it is explicit, convex, or linear.`]);

/* ---------- WEEK 2 ---------- */
mk(2,1,1,
 [r`The second-order Taylor expansion of a twice-differentiable function is always a polynomial of degree at most two.`], TF, 0,
 [r`**True.** The second-order expansion at \(a\) is`, r`\[ f(a)+\nabla f(a)^\top(x-a)+\tfrac12(x-a)^\top\nabla^2 f(a)(x-a), \]`, r`which has terms of degree 0, 1 and 2 only. Its degree can be lower (for example if the Hessian is zero), hence "at most two".`]);

mk(2,2,1,
 [r`If \(f:\mathbb{R}^n\to\mathbb{R}\) is quadratic, then its second-order Taylor expansion at any point \(a\) agrees with \(f\) everywhere.`], TF, 0,
 [r`**True.** A quadratic function has no derivatives of order 3 or higher, so the Taylor remainder is exactly zero. The second-order expansion therefore reproduces \(f\) exactly, at every point \(x\) and for every base point \(a\).`]);

mk(2,3,1,
 [r`If`, r`\[ \nabla f(x^*)=0, \]`, r`then \(x^*\) must be a local minimum of \(f\) over \(\mathbb{R}^n\).`], TF, 1,
 [r`**False.** \(\nabla f(x^*)=0\) is only a stationarity condition. Stationary points can be local maxima or saddle points.`,
  r`Examples: \(f(x)=-x^2\) at \(0\) is a maximum, and \(f(x)=x^3\) at \(0\) is a stationary point that is neither.`]);

mk(2,4,1,
 [r`If \(x^*\) is a local minimum of a differentiable function over a constrained set, then necessarily`, r`\[ \nabla f(x^*)=0. \]`], TF, 1,
 [r`**False.** The condition \(\nabla f(x^*)=0\) is necessary for unconstrained minima. With constraints, the minimum can sit on the boundary where the gradient is not zero.`,
  r`Example: minimise \(f(x)=x\) over \([0,1]\). The minimum is at \(x^*=0\), but \(f'(0)=1\ne0\).`]);

mk(2,5,1,
 [r`Let`, r`\[ \phi(t)=f(a+td). \]`, r`The slope of \(\phi\) at \(t=0\) is`, r`\[ \phi'(0)=\nabla f(a)^\top d. \]`], TF, 0,
 [r`**True (chain rule).** \(\phi'(t)=\nabla f(a+td)^\top d\). Evaluating at \(t=0\) gives \(\phi'(0)=\nabla f(a)^\top d\), the directional derivative of \(f\) at \(a\) in direction \(d\).`,
  r`This is the key link between the gradient and descent directions: \(d\) is a descent direction when \(\nabla f(a)^\top d<0\).`]);

mk(2,6,1,
 [r`Suppose \(x^*\) is stationary and \(d_0\) is a zero eigenvector of \(\nabla^2 f(x^*)\). Then`, r`\[ f(x^*+td_0)=f(x^*) \]`, r`for every sufficiently small \(t\).`], TF, 1,
 [r`**False.** A zero eigenvalue only kills the second-order term: \(f(x^*+td_0)\approx f(x^*)+\tfrac12t^2d_0^\top\nabla^2f(x^*)d_0=f(x^*)\). Third and higher order terms can still change \(f\).`,
  r`Counterexample: \(f(x)=x^3\), \(x^*=0\), \(d_0=1\). Then \(f''(0)=0\), but \(f(t)=t^3\ne f(0)\) for \(t\ne0\).`]);

mk(2,7,1,
 [r`If \(x^*\) is stationary and \(\nabla^2 f(x^*)\) is positive semidefinite, then \(x^*\) must be a local minimum.`], TF, 1,
 [r`**False.** A positive semidefinite Hessian is only a necessary condition for a local minimum (second-order necessary condition). The sufficient condition needs \(\nabla^2f(x^*)\) positive definite.`,
  r`Counterexample: \(f(x)=x^3\) at \(0\) has \(f'(0)=0\) and \(f''(0)=0\succeq0\), yet \(0\) is not a local minimum.`]);

mk(2,8,1,
 [r`If every entry of the Hessian \(\nabla^2 f(x)\) is nonnegative for every \(x\), then \(f\) is necessarily convex.`], TF, 1,
 [r`**False.** Convexity needs the Hessian to be positive semidefinite, which is about eigenvalues, not about the signs of entries.`,
  r`Counterexample: `, r`\[ H=\begin{pmatrix}1&2\\2&1\end{pmatrix} \]`, r`has all entries nonnegative, but its eigenvalues are \(3\) and \(-1\). So \(f(x)=\tfrac12x^\top Hx\) is not convex.`]);

mk(2,9,1,
 [r`Every affine function is both convex and concave.`], TF, 0,
 [r`**True.** For affine \(f(x)=a^\top x+b\): \(f(\lambda x+(1-\lambda)y)=\lambda f(x)+(1-\lambda)f(y)\) for all \(\lambda\in[0,1]\). The convexity inequality \(\le\) and the concavity inequality \(\ge\) both hold with equality.`]);

mk(2,10,1,
 [r`Let`, r`\[ f(x_1,x_2)=x_1^2+4x_2^2. \]`, r`What is \(\nabla f(1,-1)\)?`],
 [r`\(\begin{pmatrix}1\\-4\end{pmatrix}\)`, r`\(\begin{pmatrix}2\\-8\end{pmatrix}\)`, r`\(\begin{pmatrix}2\\8\end{pmatrix}\)`, r`\(\begin{pmatrix}1\\-8\end{pmatrix}\)`], 1,
 [r`**Differentiate each variable:** \(\dfrac{\partial f}{\partial x_1}=2x_1\) and \(\dfrac{\partial f}{\partial x_2}=8x_2\).`,
  r`At \((1,-1)\): \(\nabla f(1,-1)=\begin{pmatrix}2\cdot1\\8\cdot(-1)\end{pmatrix}=\begin{pmatrix}2\\-8\end{pmatrix}\).`]);

mk(2,11,1,
 [r`Let`, r`\[ f(x_1,x_2)=x_1^2+4x_2^2. \]`, r`What is its Hessian?`],
 [r`\(\begin{pmatrix}1&0\\0&4\end{pmatrix}\)`, r`\(\begin{pmatrix}2&0\\0&8\end{pmatrix}\)`, r`\(\begin{pmatrix}2&4\\4&8\end{pmatrix}\)`, r`\(\begin{pmatrix}2x_1&0\\0&8x_2\end{pmatrix}\)`], 1,
 [r`**Second derivatives:** \(\dfrac{\partial^2f}{\partial x_1^2}=2\), \(\dfrac{\partial^2f}{\partial x_2^2}=8\), and the mixed derivative \(\dfrac{\partial^2f}{\partial x_1\partial x_2}=0\).`,
  r`So \(\nabla^2f=\begin{pmatrix}2&0\\0&8\end{pmatrix}\), a constant matrix (as expected for a quadratic). The last option is the gradient entries, not the second derivatives.`]);

mk(2,12,1,
 [r`What is the third-order Taylor expansion of \(f(x)=e^x\) at \(a=0\)?`],
 [r`\(1+x\)`, r`\(1+x+\dfrac{x^2}{2}\)`, r`\(1+x+\dfrac{x^2}{2}+\dfrac{x^3}{6}\)`, r`\(1+x+x^2+x^3\)`], 2,
 [r`**Every derivative of \(e^x\) is \(e^x\)**, which equals 1 at \(0\). So`, r`\[ e^x\approx\sum_{k=0}^{3}\frac{f^{(k)}(0)}{k!}x^k=1+x+\frac{x^2}{2!}+\frac{x^3}{3!}. \]`,
  r`Don't forget the factorials: \(2!=2\) and \(3!=6\). The last option omits them.`]);

mk(2,13,1,
 [r`Suppose \(x^*\) is stationary and`, r`\[ \nabla^2 f(x^*)=\begin{pmatrix}2&0\\0&-2\end{pmatrix}. \]`, r`The eigenvectors are`, r`\[ d_1=\begin{pmatrix}1\\0\end{pmatrix},\qquad d_2=\begin{pmatrix}0\\1\end{pmatrix}. \]`, r`What happens when we move a small distance from \(x^*\) along these directions?`],
 [r`Along \(d_1\) the function value increases, while along \(d_2\) it decreases.`, r`Along \(d_1\) the function value decreases, while along \(d_2\) it increases.`, r`Along both \(d_1\) and \(d_2\) the function value increases.`, r`Along both \(d_1\) and \(d_2\) the function value decreases.`], 0,
 [r`**Use the second-order expansion at a stationary point** (the gradient term is 0):`, r`\[ f(x^*+td)\approx f(x^*)+\tfrac12t^2\,d^\top\nabla^2f(x^*)\,d. \]`,
  r`For \(d_1\): \(d_1^\top Hd_1=2>0\), so \(f\) increases. For \(d_2\): \(d_2^\top Hd_2=-2<0\), so \(f\) decreases. The point is a saddle.`]);

mk(2,14,1,
 [r`Let \(A\) be symmetric and consider`, r`\[ f(x)=\tfrac12x^\top Ax+b^\top x+c. \]`, r`When is \(f\) convex?`],
 [r`If and only if \(A\) is invertible`, r`If and only if every entry of \(A\) is nonnegative`, r`If and only if \(A\) is positive semidefinite`, r`If and only if \(b=0\)`], 2,
 [r`**The Hessian of this quadratic is \(\nabla^2f(x)=A\) for every \(x\).** A twice-differentiable function is convex iff its Hessian is positive semidefinite everywhere, so \(f\) is convex iff \(A\succeq0\).`,
  r`Why the others fail: \(-I\) is invertible but gives a concave function. Nonnegative entries do not imply PSD (see the earlier \(\begin{pmatrix}1&2\\2&1\end{pmatrix}\) example). The linear term \(b^\top x\) and the constant \(c\) never affect convexity.`]);

mk(2,15,1,
 [r`Let \(f:\mathbb{R}^n\to\mathbb{R}\) be twice continuously differentiable. Which condition is equivalent to convexity?`],
 [r`\(\nabla f(x)=0\) for every \(x\).`, r`\(\nabla^2f(x)\) is positive definite at one point.`, r`\(\nabla^2f(x)\) is positive semidefinite for every \(x\).`, r`Every entry of \(\nabla^2f(x)\) is nonnegative.`], 2,
 [r`**Second-order characterisation of convexity:** for twice continuously differentiable \(f\), \(f\) is convex iff \(\nabla^2f(x)\succeq0\) for all \(x\) (in the domain).`,
  r`Why the others fail: \(\nabla f\equiv0\) means \(f\) is constant (convex, but far from equivalent). Positive definite at one point says nothing about other points. Nonnegative entries is not the same as PSD.`]);

/* ---------- WEEK 3 ---------- */
mk(3,1,10,
 [r`Suppose \(f:\mathbb{R}^n\to\mathbb{R}\) is convex. Then the set`, r`\[ \{x\in\mathbb{R}^n : f(x)\ge0\} \]`, r`must be convex.`], TF, 1,
 [r`**False.** Convex functions have convex sublevel sets \(\{f\le t\}\), not superlevel sets \(\{f\ge t\}\).`,
  r`Counterexample: \(f(x)=x^2-1\). Then \(\{f\ge0\}=(-\infty,-1]\cup[1,\infty)\). The points \(-1\) and \(1\) are in the set but their midpoint \(0\) is not.`]);

mk(3,2,10,
 [r`Suppose \(f:\mathbb{R}^n\to\mathbb{R}\) is convex. Then, for every \(t\in\mathbb{R}\), the sublevel set`, r`\[ \{x\in\mathbb{R}^n : f(x)\le t\} \]`, r`is convex.`], TF, 0,
 [r`**True.** Take \(x,y\) with \(f(x)\le t\) and \(f(y)\le t\), and \(\lambda\in[0,1]\). By convexity,`, r`\[ f(\lambda x+(1-\lambda)y)\le\lambda f(x)+(1-\lambda)f(y)\le\lambda t+(1-\lambda)t=t. \]`, r`So the convex combination stays in the set.`]);

mk(3,3,10,
 [r`Consider the function`, r`\[ f(x,y)=\tfrac12e^{-2x+4y}-3x-5y+(x-y)^2. \]`, r`Is \(f\) convex?`], YN, 0,
 [r`**Decompose instead of computing a Hessian.**`,
  r`\(\tfrac12e^{-2x+4y}\) is a positive multiple of exp applied to an affine function, so it is convex. \(-3x-5y\) is affine, hence convex. \((x-y)^2\) is a convex square of an affine function.`,
  r`A sum of convex functions is convex, so \(f\) is convex.`]);

mk(3,4,10,
 [r`Let`, r`\[ f(x)=a^\top x+b. \]`, r`Which argument shows that \(|f(x)|\) is convex?`],
 [r`We have \(|f(x)|=\max\{f(x),-f(x)\}\), and both \(f\) and \(-f\) are affine.`, r`The absolute value of every function is convex.`, r`The minimum of two affine functions is convex.`], 0,
 [r`**Pointwise maximum preserves convexity.** \(|f|=\max\{f,-f\}\), and \(f\) and \(-f\) are both affine, hence convex. So \(|f|\) is a max of convex functions, which is convex.`,
  r`Why the others fail: the absolute value of a non-convex function need not be convex (e.g. \(|x^2-1|\)). The minimum of two affine functions is concave, e.g. \(\min\{x,-x\}=-|x|\).`]);

mk(3,5,10,
 [r`Suppose \(f\) and \(g\) are convex. Then their product`, r`\[ h(x)=f(x)g(x) \]`, r`must be convex.`], TF, 1,
 [r`**False.** Take \(f(x)=x\) and \(g(x)=-x\). Both are affine, hence convex, but \(h(x)=-x^2\) is concave.`,
  r`Products do not preserve convexity in general. Signs are the usual culprit.`]);

mk(3,6,10,
 [r`Maximizing a concave function over a convex set is a convex optimization problem.`], TF, 0,
 [r`**True.** \(\max_{x\in C}f(x)\) is equivalent to \(\min_{x\in C}\,(-f(x))\). If \(f\) is concave then \(-f\) is convex, and \(C\) is convex, which is exactly a convex optimization problem.`]);

mk(3,7,10,
 [r`Suppose \(h\) and \(g\) are both convex. Then \(h\circ g\) must be convex.`], TF, 1,
 [r`**False.** Take \(h(u)=-u\) (affine, so convex) and \(g(x)=x^2\) (convex). Then \(h(g(x))=-x^2\) is concave.`,
  r`Another counterexample: \(h(u)=e^{-u}\) and \(g(x)=x^2\) gives the bell curve \(e^{-x^2}\), which is not convex. The failure comes from \(h\) being decreasing. Monotonicity of \(h\) matters.`]);

mk(3,8,10,
 [r`Let \(A\) be a matrix and \(b\) a vector. Consider`, r`\[ f(x)=e^{\|Ax+b\|_2}. \]`, r`Is \(f\) convex?`], YN, 0,
 [r`**Build it up with composition rules.** \(x\mapsto Ax+b\) is affine, and a norm is convex, so \(\|Ax+b\|_2\) is convex. The exponential is convex and nondecreasing.`,
  r`Convex nondecreasing \(h\) composed with convex \(g\) is convex, so \(f\) is convex.`]);

mk(3,9,10,
 [r`Suppose \(h:\mathbb{R}\to\mathbb{R}\) and \(g:\mathbb{R}^n\to\mathbb{R}\). Which condition guarantees that the composition \(h\circ g\) is convex?`],
 [r`\(h\) is convex and nonincreasing, and \(g\) is convex.`, r`\(h\) is convex and nonincreasing, and \(g\) is concave.`, r`\(h\) is convex and nondecreasing, and \(g\) is concave.`, r`\(h\) is concave and nondecreasing, and \(g\) is convex.`], 1,
 [r`**Chain the inequalities.** If \(g\) is concave, \(g(\lambda x+(1-\lambda)y)\ge\lambda g(x)+(1-\lambda)g(y)\). A nonincreasing \(h\) reverses this: \(h(g(\text{mix}))\le h(\lambda g(x)+(1-\lambda)g(y))\). Convexity of \(h\) then gives \(\le\lambda h(g(x))+(1-\lambda)h(g(y))\).`,
  r`**Valid rules:** (convex, nondecreasing \(h\)) with convex \(g\); or (convex, nonincreasing \(h\)) with concave \(g\).`,
  r`Why the others fail: option 1 and option 3 both have the wrong monotonicity pairing (counterexample \(e^{-x^2}\)). Option 4 is a concave-composition rule, not a convex one.`]);

mk(3,10,10,
 [r`Consider the function`, r`\[ f(x,y)=xy. \]`, r`Which argument shows that \(f\) is not convex?`],
 [r`The function is continuous.`, r`For every fixed \(y\), the function \(x\mapsto xy\) is affine.`, r`Restricting \(f\) to the line \((x,y)=(t,-t)\) gives`, r`We have \(f(0,0)=0\).`], 2,
 [r`**Restrict to a line.** A convex function restricted to any line must be convex. Along \((t,-t)\), \(f(t,-t)=t\cdot(-t)=-t^2\), which is concave, so \(f\) cannot be convex.`,
  r`Why the others fail: continuity does not imply convexity. Being affine in \(x\) for each fixed \(y\) only gives separate convexity, not joint convexity. The value \(f(0,0)=0\) is irrelevant. (Also, the Hessian \(\begin{pmatrix}0&1\\1&0\end{pmatrix}\) has eigenvalues \(\pm1\), so it is indefinite.)`]);
/* fix: option 3 of W3 Q10 includes its full equation line */
Q[Q.length-1].opts[2]=r`Restricting \(f\) to the line \((x,y)=(t,-t)\) gives \(f(t,-t)=-t^2\), which is not convex.`;

/* ---------- WEEK 4 ---------- */
mk(4,1,10,
 [r`Gradient descent with step size \(t_k>0\) uses \(x_{k+1}=x_k-t_k\nabla f(x_k)\). Which statement is correct?`],
 [r`The vectors \(x_{k+1}\) and \(x_k\) are always parallel.`, r`In general, \(x_{k+1}\) and \(x_k\) need not be parallel.`, r`The vectors \(x_{k+1}\) and \(x_k\) are always orthogonal.`], 1,
 [r`**Parallel only if \(\nabla f(x_k)\) is a multiple of \(x_k\)**, and nothing forces that.`,
  r`Counterexample: \(f(x,y)=x^2+3y^2\), start at \((1,1)\). The gradient is \((2,6)\), so with \(t=0.1\): \(x_1=(0.8,0.4)\), which is not a multiple of \((1,1)\).`,
  r`"Always orthogonal" fails too: for \(f=\tfrac12\|x\|^2\), \(x_1=(1-t)x_0\), which is parallel to \(x_0\).`]);

mk(4,2,10,
 [r`Assume that \(\nabla f(x)\ne0\). Among all unit vectors \(d\), which direction gives the largest local increase in \(f\) from \(x\)?`],
 [r`\(d=-\nabla f(x)\)`, r`\(d=\dfrac{\nabla f(x)}{\|\nabla f(x)\|}\)`, r`Any vector satisfying \(\langle\nabla f(x),d\rangle=0\)`, r`\(d=-\dfrac{\nabla f(x)}{\|\nabla f(x)\|}\)`], 1,
 [r`**Cauchy–Schwarz.** For a unit vector \(d\), \(\langle\nabla f(x),d\rangle\le\|\nabla f(x)\|\|d\|=\|\nabla f(x)\|\), with equality iff \(d=\nabla f(x)/\|\nabla f(x)\|\). The first-order increase is \(t\langle\nabla f,d\rangle\), so this \(d\) maximises it.`,
  r`Option 1 is not a unit vector and points downhill. Option 4 is the steepest descent direction. Option 3 gives zero first-order change (the contour direction).`]);

mk(4,3,10,
 [r`Suppose that \(d\) is a descent direction at \(x\), so that \(\langle\nabla f(x),d\rangle<0\). What does this guarantee?`],
 [r`We have \(f(x+td)<f(x)\) for every \(t>0\).`, r`We have \(f(x+td)<f(x)\) only when \(t=1\).`, r`We have \(f(x+td)<f(x)\) for all sufficiently small \(t>0\).`], 2,
 [r`**It is a local statement.** Let \(\varphi(t)=f(x+td)\). Then \(\varphi'(0)=\langle\nabla f(x),d\rangle<0\), so \(\varphi(t)<\varphi(0)\) for all sufficiently small \(t>0\).`,
  r`"For every \(t>0\)" is false: take \(f(x)=x^2\), \(x=1\), \(d=-1\). Then \(f(1-t)=(1-t)^2>f(1)=1\) once \(t>2\) (overshoot).`]);

mk(4,4,10,
 [r`Which of the displayed functions are globally \(L\)-smooth on \(\mathbb{R}\) for some finite \(L\)?`],
 ['A only','A and B only','A and C only','A, B, and C'], 0,
 [r`**\(L\)-smooth means \(\nabla f\) is \(L\)-Lipschitz**, which for a twice-differentiable function of one variable means \(|f''|\le L\) everywhere.`,
  r`**A:** \(f''=2\), so \(L=2\). Yes. **B:** \(f''=12x^2\) is unbounded as \(|x|\to\infty\). No. **C:** \(f'(x)=\tfrac32\,\mathrm{sign}(x)|x|^{1/2}\), and \(|f'(x)-f'(0)|/|x|=\tfrac32|x|^{-1/2}\to\infty\) as \(x\to0\), so the gradient is not Lipschitz at 0. No.`,
  r`B fails at infinity (too steep), C fails at the origin (gradient too sharp). Smoothness bounds the curvature everywhere.`], 'q4');

mk(4,5,10,
 [r`The red arrow represents \(-\nabla f(x_k)\). If gradient descent uses step size \(t_k=1\), which labeled point is \(x_{k+1}\)?`],
 ['A','B','C','None of the displayed points'], 1,
 [r`**With \(t_k=1\), the step is exactly the arrow.** \(x_{k+1}=x_k+1\cdot(-\nabla f(x_k))\), so \(x_{k+1}\) is the tip of the red arrow.`,
  r`In the picture the arrow ends at B. Point A is only part of the way along the arrow (a smaller step), and C overshoots it.`], 'q5');

mk(4,6,10,
 [r`Consider the update \(x_{k+1}=x_k-\tfrac12\nabla f(x_k)+\tfrac12(x_k-x_{k-1})\). Which labeled point is \(x_{k+1}\)?`],
 ['A','B','C','None of the displayed points'], 2,
 [r`**Split the update into two half-arrows** starting from \(x_k\):`, r`\[ x_{k+1}=x_k+\underbrace{\tfrac12\bigl(-\nabla f(x_k)\bigr)}_{\text{half of red}}+\underbrace{\tfrac12(x_k-x_{k-1})}_{\text{half of green}}. \]`,
  r`Half of the red arrow alone lands at A (the gradient-only step). Half of the green arrow alone lands at B (the momentum-only step). The actual update is the vector sum of the two halves, i.e. the far corner of the parallelogram, which is C.`], 'q6');

mk(4,7,10,
 [r`Suppose that \(f\) is differentiable and gradient descent is applied with a fixed positive step size. Must the iterates converge to an optimizer of \(f\)?`],
 ['Yes, because every gradient step decreases the objective.','Yes, provided the starting point is finite.','No. Without additional assumptions, gradient descent need not converge to an optimizer.'], 2,
 [r`**No guarantee without extra assumptions.**`,
  r`Step too large: \(f(x)=x^2\) with \(t=1.5\) gives \(x_{k+1}=-2x_k\), which diverges (so a step does not always decrease the objective). No minimiser: \(f(x)=e^x\) has none, and GD drifts to \(-\infty\). Nonconvex \(f\): GD can stop at a saddle point or a non-global local minimum.`,
  r`"Provided the starting point is finite" is meaningless: every starting point is finite.`]);

mk(4,8,10,
 [r`For a descent direction \(d_k\), the Armijo condition is`, r`\[ f(x_k)-f(x_k+td_k)\ \ge\ c_1\bigl[-t\langle\nabla f(x_k),d_k\rangle\bigr]. \]`, r`Which choice of \(c_1\) is more restrictive?`],
 [r`\(c_1=\tfrac12\) is more restrictive than \(c_1=\tfrac13\).`, r`\(c_1=\tfrac13\) is more restrictive than \(c_1=\tfrac12\).`, r`The two choices are equally restrictive.`], 0,
 [r`**Read it as:** actual decrease \(\ge c_1\times\) (decrease predicted by the linear model). Since \(-t\langle\nabla f,d_k\rangle>0\), a larger \(c_1\) demands a larger actual decrease, so it accepts fewer step sizes \(t\).`,
  r`Hence \(c_1=\tfrac12\) is more restrictive: its set of accepted steps is a subset of the one for \(c_1=\tfrac13\). As \(c_1\to1\) only tiny steps pass; as \(c_1\to0\) almost any decreasing step passes.`]);

mk(4,9,10,
 [r`Is the heavy-ball method necessarily a descent method, meaning that it satisfies \(f(x_{k+1})<f(x_k)\), unless at a stationary point?`],
 ['Yes, because it always contains the negative gradient direction.','Yes, whenever the momentum parameter is positive.','No. The momentum term can cause the objective value to increase at some iterations.'], 2,
 [r`**Heavy ball:** \(x_{k+1}=x_k-t\nabla f(x_k)+\beta(x_k-x_{k-1})\). The negative gradient is only part of the step.`,
  r`If the momentum term \(\beta(x_k-x_{k-1})\) is large and points uphill, it can outweigh the gradient term, so \(f\) can increase. This holds even for \(\beta>0\). Heavy ball is therefore not a descent method (it can overshoot and oscillate), which is the typical momentum behaviour.`]);

mk(4,10,1,
 [r`Which statement correctly classifies the two displayed directions at \(x_k\)?`],
 [r`\(d_1\) is a descent direction and \(d_2\) is an ascent direction.`, r`\(d_1\) is an ascent direction and \(d_2\) is a descent direction.`, r`Both \(d_1\) and \(d_2\) are descent directions.`, r`Neither \(d_1\) nor \(d_2\) changes the objective locally.`], 0,
 [r`**Test the sign of \(\langle\nabla f(x_k),d\rangle\).** \(\nabla f\) points outward, toward higher level sets.`,
  r`\(d_1\) points inward (toward lower values), so \(\langle\nabla f,d_1\rangle<0\): descent. \(d_2\) has a positive component along the gradient, so \(\langle\nabla f,d_2\rangle>0\): ascent.`,
  r`Neither direction is tangent to the contour (that would need \(\langle\nabla f,d\rangle=0\)), so the last option is wrong.`], 'q10');

function renderMath(tex,display){
  try{const h=katex.renderToString(tex,{displayMode:display,output:'mathml',throwOnError:false,strict:false});
      return display?'<span class="dm">'+h+'</span>':h;}
  catch(e){return esc(tex);}
}
function fmt(s){
  const toks=[];
  let t=String(s).replace(/\\\(([\s\S]+?)\\\)|\\\[([\s\S]+?)\\\]/g,(m,a,b)=>{toks.push(a!==undefined?renderMath(a,false):renderMath(b,true));return '\u0000'+(toks.length-1)+'\u0000';});
  t=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  return t.replace(/\u0000(\d+)\u0000/g,(m,i)=>toks[+i]);
}
const paras=a=>a.map(p=>'<p>'+fmt(p)+'</p>').join('');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const barColor=p=>p===null?'var(--track)':p>=80?'var(--good)':p>=50?'var(--warn)':'var(--bad)';

function typeset(){} /* maths is pre-rendered by KaTeX (native MathML), nothing to do after insertion */

/* ===================== HOME ===================== */
function weekStats(w){
  const qs=Q.filter(q=>q.week===w);let att=0,cor=0;
  qs.forEach(q=>{const p=progress[q.id];if(p){att++;if(p.last)cor++;}});
  return {total:qs.length,att,cor};
}
function renderHome(){
  state.view='home';state.session=null;
  const cards=[1,2,3,4].map(w=>{
    const st=weekStats(w),pct=st.att?Math.round(st.cor/st.att*100):null,on=state.sel.has(w);
    return `<label class="wk${on?' on':''}">
      <input type="checkbox" data-w="${w}" ${on?'checked':''}>
      <div class="wk-head"><div><div class="wk-name">${WEEKS[w].name}</div><div class="wk-topic">${WEEKS[w].topic}</div></div><span class="check">${on?'✓':''}</span></div>
      <div class="acc">
        <div class="pct">${pct===null?'—':pct+'%'}</div>
        <div class="bar"><i style="width:${pct||0}%;background:${barColor(pct)}"></i></div>
        <div class="acc-sub">${st.att?st.cor+'/'+st.att+' questions':'No attempts yet'}</div>
        <div class="acc-note">${st.att} of ${st.total} questions attempted</div>
      </div></label>`;
  }).join('');
  const n=Q.filter(q=>state.sel.has(q.week)).length;
  app.innerHTML=`
    <h1>40.302 Quiz Builder</h1>
    <p class="sub">Pick your weeks, choose the order, and get an explanation after every answer.</p>
    <div class="sec">1. Choose weeks</div>
    <div class="weeks">${cards}</div>
    <div class="row" style="margin-top:12px">
      <button class="btn ghost small" id="all">Select all</button>
      <button class="btn ghost small" id="none">Clear</button>
    </div>
    <div class="sec">2. Question order</div>
    <div class="seg" role="radiogroup" aria-label="Question order">
      <label><input type="radio" name="ord" value="seq" ${state.order==='seq'?'checked':''}><span>In sequence</span></label>
      <label><input type="radio" name="ord" value="random" ${state.order==='random'?'checked':''}><span>Random</span></label>
    </div>
    <p class="hint">${state.order==='seq'?'Questions run by week, then by question number.':'Questions from the selected weeks are shuffled together.'}</p>
    <div class="startbar row">
      <button class="btn" id="start" ${n?'':'disabled'}>Start quiz${n?' ('+n+' questions)':''}</button>
    </div>
    <p class="hint">Accuracy uses your most recent answer to each question, so retrying a question you missed updates your score. Progress is saved in this browser.</p>
    <button class="linkbtn ${state.confirmReset?'warn':''}" id="reset">${state.confirmReset?'Click again to erase all progress':'Reset progress'}</button>`;
  app.querySelectorAll('.wk input').forEach(cb=>cb.addEventListener('change',()=>{
    const w=+cb.dataset.w;cb.checked?state.sel.add(w):state.sel.delete(w);persistPrefs();renderHome();}));
  app.querySelectorAll('input[name=ord]').forEach(rb=>rb.addEventListener('change',()=>{state.order=rb.value;persistPrefs();renderHome();}));
  document.getElementById('all').onclick=()=>{[1,2,3,4].forEach(w=>state.sel.add(w));persistPrefs();renderHome();};
  document.getElementById('none').onclick=()=>{state.sel.clear();persistPrefs();renderHome();};
  document.getElementById('start').onclick=()=>{let qs=Q.filter(q=>state.sel.has(q.week));if(state.order==='random')qs=shuffle(qs);startSession(qs);};
  document.getElementById('reset').onclick=()=>{
    if(!state.confirmReset){state.confirmReset=true;renderHome();return;}
    progress={};save(KEY,progress);state.confirmReset=false;renderHome();};
  window.scrollTo(0,0);
}
function persistPrefs(){state.confirmReset=false;save(PKEY,{sel:[...state.sel],order:state.order});}

/* ===================== QUIZ ===================== */
function startSession(qs){state.session={qs,i:0,results:[],answered:false};renderQuestion();}

function renderQuestion(){
  state.view='quiz';
  const s=state.session,q=s.qs[s.i];s.answered=false;
  const done=s.results.length,total=s.qs.length;
  const textHtml=q.text.map(p=>'<p>'+fmt(p)+'</p>').join('');
  app.innerHTML=`
    <div class="top">
      <button class="btn ghost small" id="quit">← Home</button>
      <div class="grow"><div class="prog"><i style="width:${Math.round(done/total*100)}%"></i></div></div>
      <div class="count">${s.i+1} / ${total}</div>
    </div>
    <div class="card">
      <div class="tags"><span class="tag">${WEEKS[q.week].name}</span><span class="tag plain">Question ${q.n}</span><span class="tag plain">${q.pts} ${q.pts===1?'point':'points'}</span></div>
      <div class="q">${textHtml}${q.img?`<div class="fig"><img src="${IMG[q.img]}" alt="${esc(ALT[q.img])}"></div>`:''}</div>
      <div class="opts" id="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="letter">${'ABCD'[i]}</span><span class="otext">${fmt(o)}</span></button>`).join('')}</div>
      <div id="fb"></div>
    </div>`;
  document.getElementById('quit').onclick=renderHome;
  app.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>choose(+b.dataset.i)));
  typeset(app);window.scrollTo(0,0);
}

function choose(i){
  const s=state.session;if(s.answered)return;s.answered=true;
  const q=s.qs[s.i],ok=i===q.ans;
  const p=progress[q.id]||{attempts:0,correct:0};
  progress[q.id]={last:ok,attempts:p.attempts+1,correct:p.correct+(ok?1:0)};save(KEY,progress);
  s.results.push({id:q.id,week:q.week,ok});
  app.querySelectorAll('.opt').forEach(b=>{
    const j=+b.dataset.i;b.disabled=true;
    if(j===q.ans)b.classList.add('correct');
    else if(j===i)b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const last=s.i===s.qs.length-1;
  const fb=document.getElementById('fb');
  fb.innerHTML=`<div class="fb ${ok?'good':'bad'}">
      <div class="fbhead">${ok?'✓ Correct':'✗ Not quite. The correct answer is '+'ABCD'[q.ans]+'.'}</div>
      <div class="exp">${paras(q.exp)}</div>
    </div>
    <div class="next"><button class="btn" id="next">${last?'See results':'Next question →'}</button></div>`;
  document.getElementById('next').onclick=advance;
  typeset(fb);
  fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function advance(){
  const s=state.session;
  if(s.i>=s.qs.length-1){renderResults();return;}
  s.i++;renderQuestion();
}

/* ===================== RESULTS ===================== */
function renderResults(){
  state.view='results';
  const s=state.session,total=s.results.length,right=s.results.filter(x=>x.ok).length;
  const pct=total?Math.round(right/total*100):0;
  const weeks=[...new Set(s.results.map(x=>x.week))].sort();
  const rows=weeks.map(w=>{
    const rs=s.results.filter(x=>x.week===w),c=rs.filter(x=>x.ok).length,p=Math.round(c/rs.length*100);
    return `<div class="item"><div class="line"><span>${WEEKS[w].name}</span><span>${p}%</span></div>
      <div class="bar"><i style="width:${p}%;background:${barColor(p)}"></i></div>
      <div class="acc-note" style="margin-top:6px">${c}/${rs.length} questions</div></div>`;
  }).join('');
  const missed=s.results.filter(x=>!x.ok).map(x=>x.id);
  app.innerHTML=`
    <h1>Quiz complete</h1>
    <div class="card" style="margin-top:14px">
      <div class="big" style="color:${barColor(pct)}">${pct}%</div>
      <div class="acc-sub">${right}/${total} questions correct</div>
      <div class="bar" style="margin-top:12px"><i style="width:${pct}%;background:${barColor(pct)}"></i></div>
    </div>
    <div class="sec">This session by week</div>
    <div class="rw">${rows}</div>
    <div class="row" style="margin-top:26px">
      <button class="btn" id="home">Back to home</button>
      ${missed.length?`<button class="btn ghost" id="retry">Retry ${missed.length} missed</button>`:''}
    </div>`;
  document.getElementById('home').onclick=renderHome;
  const rt=document.getElementById('retry');
  if(rt)rt.onclick=()=>{const set=new Set(missed);let qs=Q.filter(q=>set.has(q.id));if(state.order==='random')qs=shuffle(qs);startSession(qs);};
  window.scrollTo(0,0);
}

/* keyboard: 1-4 / A-D to answer, Enter for next */
document.addEventListener('keydown',e=>{
  if(state.view!=='quiz'||!state.session)return;
  const s=state.session;
  if(!s.answered){
    const k=e.key.toLowerCase();let i=-1;
    if('1234'.includes(k)&&k.length===1)i=+k-1;else if('abcd'.includes(k)&&k.length===1)i=k.charCodeAt(0)-97;
    if(i>=0&&i<s.qs[s.i].opts.length)choose(i);
  }else if(e.key==='Enter'){e.preventDefault();advance();}
});

renderHome();
</script>
</body>
</html>
